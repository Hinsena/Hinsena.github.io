<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kleidung 123 – Studie</title>
  <style>
    /* ===== Kleidung 123 ===== */
    body {
      margin: 0;
      font-family: "Arial", sans-serif;
      background-color: #f5efe6; /* Beige */
    }

    header {
      background-color: #5c4631; /* Dunkelbraun */
      color: white;
      padding: 25px 0;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      border-radius: 12px;
      padding: 35px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-top: 6px solid #5c4631; /* Brauner oberer Rand */
    }

    h2 {
      text-align: center;
      color: #5c4631;
      font-size: 24px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
      color: #5c4631;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #c9b8a4;
      box-sizing: border-box;
      background-color: #fffdf9;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 6px;
      background-color: #5c4631; /* Dunkelbraun */
      color: white;
      font-size: 17px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #a68b6a; /* hellbraun */
    }

    .error {
      color: red;
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
    }

    .screen { display: none; }
    .active { display: block; }
  </style>
</head>
<body>

<header>Kleidung 123 – Online Shop</header>

<!-- Registrierung -->
<div id="registerScreen" class="container screen active">
  <h2>Registrierung</h2>
  <form id="registerForm">
    <label>Username</label>
    <input name="username" required>
    <label>Passwort</label>
    <input name="password" type="password" required>
    <label>Passwort wiederholen</label>
    <input name="passwordConfirm" type="password" required>
    <button>Registrieren</button>
  </form>
  <p class="error" id="regError"></p>
</div>

<!-- Login -->
<div id="loginScreen" class="container screen">
  <h2>Login</h2>
  <form id="loginForm">
    <label>Username</label>
    <input name="username" required>
    <label>Passwort</label>
    <input name="password" type="password" required>
    <button>Login</button>
  </form>
  <p class="error" id="loginError"></p>
</div>

<!-- Erfolgs-Screen Registrierung -->
<div id="successScreen" class="container screen">
  <h2>Registrierung erfolgreich!</h2>
  <p>Ihr Kundenkonto wurde erfolgreich erstellt.</p>
  <button id="goToLoginBtn">Zum Login</button>
</div>

<!-- Erfolgs-Screen Login -->
<div id="loginSuccessScreen" class="container screen">
  <h2>Login erfolgreich!</h2>
  <p>Willkommen bei <strong>Kleidung 123</strong>!  
     Sie sind nun eingeloggt.</p>
</div>

<script>
const siteName = "Kleidung123"; 
let startTime = null;

// Fehlversuche
let regAttempts = 0;
let loginAttempts = 0;

// ---------------------------
// SCREEN SWITCHING & TIMER
// ---------------------------
function show(screenId) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(screenId).classList.add("active");
  if (startTime === null) startTime = performance.now();
}

document.getElementById("goToLoginBtn").onclick = () => {
  document.getElementById("loginForm").reset();
  document.getElementById("loginError").textContent = "";
  loginAttempts = 0; 
  show("loginScreen");
};

// ---------------------------
// REGISTRIERUNG
// ---------------------------
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  regAttempts++;

  const data = Object.fromEntries(new FormData(e.target));
  data.site_name = siteName;

  if (data.password !== data.passwordConfirm) {
    document.getElementById("regError").textContent = "Die Passwörter stimmen nicht überein!";
    return;
  }

  data.duration_ms = Math.round(performance.now() - startTime);
  data.attempts = regAttempts;
  startTime = null;

  const res = await fetch("/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.text();

  if (result === "registered") {
    regAttempts = 0;
    document.getElementById("registerForm").reset();
    document.getElementById("regError").textContent = "";
    show("successScreen");
  } else {
    document.getElementById("regError").textContent = "Fehler: " + result;
  }
});

// ---------------------------
// LOGIN
// ---------------------------
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  loginAttempts++;

  const data = Object.fromEntries(new FormData(e.target));
  data.site_name = siteName;

  data.duration_ms = Math.round(performance.now() - startTime);
  data.attempts = loginAttempts;

  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.text();

  if (result === "login ok") {
    startTime = null;
    loginAttempts = 0;
    document.getElementById("loginForm").reset();
    document.getElementById("loginError").textContent = "";
    show("loginSuccessScreen");
  } else {
    document.getElementById("loginError").textContent = "Login fehlgeschlagen! Bitte erneut versuchen.";
  }
});
</script>

</body>
</html>
